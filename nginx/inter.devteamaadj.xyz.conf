# Configuración de Nginx para el HOST (el servidor GCP, no el contenedor Docker).
# Ruta sugerida: /etc/nginx/sites-available/interoperatibilidad.devteamaadj.xyz
#
# Pasos:
#   sudo cp nginx/interoperatibilidad.devteamaadj.xyz.conf \
#             /etc/nginx/sites-available/interoperatibilidad.devteamaadj.xyz
#   sudo ln -s /etc/nginx/sites-available/interoperatibilidad.devteamaadj.xyz \
#              /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
#   sudo certbot --nginx -d interoperatibilidad.devteamaadj.xyz
#   (certbot agrega y gestiona los bloques SSL automáticamente)

server {
    listen 80;
    server_name inter.devteamaadj.xyz;
    # certbot reemplazará este bloque con la redirección a HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name inter.devteamaadj.xyz;

    # certbot completa estas rutas automáticamente
    # ssl_certificate     /etc/letsencrypt/live/inter.devteamaadj.xyz/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/inter.devteamaadj.xyz/privkey.pem;

    # Tamaño máximo para subir el Excel
    client_max_body_size 10M;

    location / {
        proxy_pass             http://localhost:8080;
        proxy_http_version     1.1;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_read_timeout     60s;
    }
}
